services:
  golden-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      Agent__Provider: ${Agent__Provider:-foundry-local}
      # Inside Docker, use host.docker.internal to reach Foundry Local on Windows host.
      Agent__FoundryLocalEndpoint: ${Agent__FoundryLocalEndpoint:-http://host.docker.internal:39839/v1}
      Agent__AzureOpenAIEndpoint: ${Agent__AzureOpenAIEndpoint:-}
      Agent__Model: ${Agent__Model:-}
      Agent__Name: ${Agent__Name:-AGIC-Agent365-GoldenAgent}
      Agent365__ExportToConsole: "true"
      Agent365__ExportToAgent365: ${Agent365__ExportToAgent365:-false}
      Agent365__AgentId: ${Agent365__AgentId:-}
      Agent365__TenantId: ${Agent365__TenantId:-}
      Agent365__ClientSecret: ${Agent365__ClientSecret:-}
      Api__RequireApiKey: ${Api__RequireApiKey:-false}
      Api__ApiKey: ${Api__ApiKey:-}
      Api__RequestsPerMinute: ${Api__RequestsPerMinute:-30}
      Api__MaxMessageCharacters: ${Api__MaxMessageCharacters:-8000}
      Api__MaxConversationIdCharacters: ${Api__MaxConversationIdCharacters:-128}
      Conversations__MaxConversations: ${Conversations__MaxConversations:-200}
      Conversations__IdleTimeoutMinutes: ${Conversations__IdleTimeoutMinutes:-30}
      A365_OBSERVABILITY_LOG_LEVEL: ${A365_OBSERVABILITY_LOG_LEVEL:-info}
